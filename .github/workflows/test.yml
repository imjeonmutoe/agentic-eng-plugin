name: test

# 가드의 허용/차단 규칙은 전부 glob 이라 한 글자만 넓혀도 조용히 뚫린다.
# 경로 필터 없이 모든 push/PR 에서 돌린다 — 실행에 1초도 걸리지 않는다.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  tdd-guard:
    name: TDD 가드 회귀 테스트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 가드와 테스트 모두 jq 에 의존한다. 없으면 여기서 명확하게 실패시킨다.
      - name: jq 확인
        run: jq --version

      - name: 회귀 테스트 실행
        run: bash tests/tdd-guard.test.sh
